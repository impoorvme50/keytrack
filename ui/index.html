<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keytrack · 输入看板</title><link rel="stylesheet" href="/console.css"><script src="/console.js" defer></script></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">⌘</div><div><strong>Keytrack</strong></div></div><div class="nav-caption">我的输入</div><nav aria-label="主要导航"><button data-page="dashboard" class="nav active"><span>▦</span>输入看板</button><button data-page="phrases" class="nav"><span>≡</span>常用语</button><div class="nav-caption">偏好设置</div><button data-page="appearance" class="nav"><span>◐</span>候选外观</button><button data-page="settings" class="nav"><span>⌘</span>输入设置</button><button data-page="backups" class="nav"><span>↺</span>备份与状态</button></nav><div class="sidebar-bottom"><div class="local-badge"><span class="dot"></span>本机保存</div><div id="sidebar-status" class="mini-status">正在连接…</div></div></aside>
<main><header class="toolbar"><div class="breadcrumb">Keytrack <span>/</span> <span id="breadcrumb">输入看板</span></div><div class="toolbar-actions"><span id="deployment" class="status-chip">正在读取</span><button id="refresh" class="icon-button" aria-label="刷新">↻</button></div></header><div id="demo-banner" class="demo-banner" hidden>演示模式 · 展示自造数据，保存操作仅修改测试配置</div><div id="content" class="content" aria-live="polite"><div class="loading">正在打开 Keytrack…</div></div></main></div>
<div id="toast" role="status" class="toast" hidden></div>
<dialog id="phrase-dialog"><form id="phrase-form"><div class="dialog-header"><div><div class="eyebrow">常用语</div><h2 id="phrase-dialog-title">添加常用语</h2></div><button type="button" data-close="phrase-dialog" class="icon-button" aria-label="关闭">×</button></div><label>分类<input id="phrase-category" required maxlength="18" placeholder="例如：工作回复"></label><label>短编码<input id="phrase-code" required pattern="[a-z]{2,20}" maxlength="20" placeholder="例如：qreply"><small>2–20 位小写字母，避开 v、u 开头。输入完整编码后用空格上屏。</small></label><label>内容<textarea id="phrase-text" required maxlength="2000" rows="5" placeholder="写下经常重复输入的内容，支持换行"></textarea></label><div class="dialog-actions"><button type="button" data-close="phrase-dialog" class="button secondary">取消</button><button class="button primary" type="submit">加入列表</button></div></form></dialog>
<dialog id="confirm-dialog"><div class="dialog-header"><h2>恢复这份备份？</h2></div><p>恢复外观、快捷键和常用语。当前设置会先备份，其他输入法配置会保留。</p><div class="dialog-actions"><button data-close="confirm-dialog" class="button secondary">取消</button><button id="confirm-restore" class="button primary">备份当前并恢复</button></div></dialog>
</body></html>
